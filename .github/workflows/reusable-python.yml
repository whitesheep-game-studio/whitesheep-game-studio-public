name: Reusable python verification

on:
  workflow_call:
    inputs:
      automation-ref:
        description: Full tested commit SHA of the common public automation repository
        type: string
        required: true
      config:
        description: Project contract relative to caller repository
        type: string
        default: .ci/project.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STUDIO_CONFIG: ${{ inputs.config }}
      STUDIO_python: python
      STUDIO_HELPERS: ${{ github.workspace }}/automation
      CI: 'true'
    steps:
      - name: Require an immutable helper revision
        env:
          AUTOMATION_REF: ${{ inputs.automation-ref }}
        run: '[[ "$AUTOMATION_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: whitesheep-game-studio/whitesheep-game-studio-public
          ref: ${{ inputs.automation-ref }}
          path: automation
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install common validation tools
        run: python -m pip install -r "$STUDIO_HELPERS/requirements.txt"
      - name: Validate project contract
        id: project
        run: python "$STUDIO_HELPERS/scripts/ci.py" preflight --root project --config "$STUDIO_CONFIG" --stack "$STUDIO_python"
      - name: Install pinned lint tool
        run: python -m pip install ruff==0.14.3
      - name: Install declared project requirements
        env:
          PROJECT_WORK: ${{ steps.project.outputs.work }}
        run: |
          python - <<'PYINSTALL'
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path(os.environ['STUDIO_HELPERS']) / 'scripts'))
          from config import inside, load
          config = load(Path('project').resolve(), os.environ['STUDIO_CONFIG'], 'python')
          for filename in config.get('requirements', []):
              subprocess.run([sys.executable, '-m', 'pip', 'install', '-r', str(inside(config['work'], filename))], check=True)
          PYINSTALL
      - name: Lint Python
        working-directory: ${{ steps.project.outputs.work }}
        run: ruff check --select E4,E7,E9,F .
      - name: Existing project unit tests
        run: python "$STUDIO_HELPERS/scripts/ci.py" checks --root project --config "$STUDIO_CONFIG" --stack "$STUDIO_python"
      - name: Validate project data
        run: python "$STUDIO_HELPERS/scripts/ci.py" data --root project --config "$STUDIO_CONFIG" --stack "$STUDIO_python"
      - name: Validate translation resources
        run: python "$STUDIO_HELPERS/scripts/ci.py" i18n --root project --config "$STUDIO_CONFIG" --stack "$STUDIO_python"
      - name: Audit resolved dependencies
        run: python "$STUDIO_HELPERS/scripts/ci.py" audit --root project --config "$STUDIO_CONFIG" --stack "$STUDIO_python"
      - name: Record actual result
        if: always()
        env:
          CI_RESULT: ${{ job.status }}
        run: python "$STUDIO_HELPERS/scripts/record_result.py"
      - name: Keep build and validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-ci-${{ github.run_attempt }}
          path: |
            ci-results/
            project/**/build/app/outputs/flutter-apk/*.apk
            project/**/ci-build/windows/
            project/**/playwright-report/
            project/**/test-results/
            project/**/.lighthouseci/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

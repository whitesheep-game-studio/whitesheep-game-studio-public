name: Reusable web verification

on:
  workflow_call:
    inputs:
      automation-ref:
        description: Full tested commit SHA of the common public automation repository
        type: string
        required: true
      config:
        description: Project contract relative to caller repository
        type: string
        default: .ci/project.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STUDIO_CONFIG: ${{ inputs.config }}
      STUDIO_web: web
      STUDIO_HELPERS: ${{ github.workspace }}/automation
      CI: 'true'
    steps:
      - name: Require an immutable helper revision
        env:
          AUTOMATION_REF: ${{ inputs.automation-ref }}
        run: '[[ "$AUTOMATION_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: whitesheep-game-studio/whitesheep-game-studio-public
          ref: ${{ inputs.automation-ref }}
          path: automation
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install common validation tools
        run: python -m pip install -r "$STUDIO_HELPERS/requirements.txt"
      - name: Validate project contract
        id: project
        run: python "$STUDIO_HELPERS/scripts/ci.py" preflight --root project --config "$STUDIO_CONFIG" --stack "$STUDIO_web"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: project/**/package-lock.json
      - name: Frozen dependency install
        working-directory: ${{ steps.project.outputs.work }}
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: ${{ steps.project.outputs.work }}
        run: npx --no-install playwright install --with-deps chromium
      - name: Existing build, links, integrity, lint, format, HTML, unit, browser, axe and Lighthouse checks
        run: python "$STUDIO_HELPERS/scripts/ci.py" checks --root project --config "$STUDIO_CONFIG" --stack "$STUDIO_web"
      - name: Validate project data
        run: python "$STUDIO_HELPERS/scripts/ci.py" data --root project --config "$STUDIO_CONFIG" --stack "$STUDIO_web"
      - name: Validate translation resources
        run: python "$STUDIO_HELPERS/scripts/ci.py" i18n --root project --config "$STUDIO_CONFIG" --stack "$STUDIO_web"
      - name: Audit resolved dependencies
        run: python "$STUDIO_HELPERS/scripts/ci.py" audit --root project --config "$STUDIO_CONFIG" --stack "$STUDIO_web"
      - name: Record actual result
        if: always()
        env:
          CI_RESULT: ${{ job.status }}
        run: python "$STUDIO_HELPERS/scripts/record_result.py"
      - name: Keep build and validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-ci-${{ github.run_attempt }}
          path: |
            ci-results/
            project/**/build/app/outputs/flutter-apk/*.apk
            project/**/ci-build/windows/
            project/**/playwright-report/
            project/**/test-results/
            project/**/.lighthouseci/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

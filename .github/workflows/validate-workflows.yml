name: Common CI foundation checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_workflows.py
      - name: Check shell syntax
        run: bash -n scripts/install_godot.sh scripts/install_actionlint.sh
      - name: Validate GitHub Actions syntax
        run: |
          bash scripts/install_actionlint.sh "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= .github/workflows/*.yml
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= workflow-templates/*.yml
      - name: Audit validation dependencies
        run: |
          python - <<'PYAUDIT'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from audit_dependencies import audit
          audit(Path('.').resolve(), {'format': 'requirements', 'files': ['requirements.txt', 'toolchain/audit-dev.txt']})
          PYAUDIT
